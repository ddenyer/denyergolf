<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Viability Thinking Lab</title>
<link rel="stylesheet" href="/family.css?v=20261105i"><link rel="stylesheet" href="/lab-family.css?v=20261105i">
<style>
/* What the client sees for How we might help: the three questions before the call (/brief),
   and the check of what was drafted (/check). Never shows the team note or other team material. */
:root { --g: #f4f3f0; --sf: #f4f3f0; --tn: #e8e5df; --tx: #141414; --t2: #3a3732; --mu: #6b665f; --fa: #8a857d; --exp: #e07030; --expt: #9a4310; --expw: #f6e3d6; --val: #1E6FD9; --ok: #1F7A4D; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--g); color: var(--tx); font: 400 16px/1.55 Inter, system-ui, sans-serif; }
main { max-width: 1000px; margin: 40px auto; padding: 0 16px 60px; }
.sheet { background: var(--sf); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 48px 64px; }
@media (max-width: 700px) { .sheet { padding: 28px 22px; } }
.aboutlink { text-align: right; margin: 14px 18px 0; font-size: 13px; } .aboutlink a { color: var(--mu); }
@media print { .aboutlink { display: none; } }
.over { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--mu); }
h1 { font-size: 32px; line-height: 1.2; margin: 8px 0 6px; font-weight: 700; }
.meta { font-size: 14px; color: var(--mu); }
.sec { border-top: 1px solid #E6E4DF; margin-top: 28px; padding-top: 22px; }
.sec h2 { font-size: 17px; margin: 0 0 10px; display: flex; justify-content: space-between; gap: 12px; }
.st { font-size: 14px; font-weight: 600; color: var(--mu); }
.st.ok { color: var(--ok); } .st.nq { color: var(--expt); }
.words { font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 1.45; border-radius: 10px; padding: 6px 10px; margin: 0 -10px; outline: none; white-space: pre-wrap; }
.words:hover { background: #FAF9F7; } .words:focus { background: #FAF9F7; box-shadow: 0 0 0 2px #D5D3CE; }
.hint { font-size: 13px; color: var(--fa); margin-top: 6px; }
.sum { margin-top: 16px; color: var(--t2); } .sum b { color: var(--tx); }
.bar { border-top: 2px solid var(--tx); margin-top: 40px; padding-top: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
button { font: 600 15px Inter, system-ui, sans-serif; cursor: pointer; border-radius: 12px; padding: 12px 18px; min-height: 48px; border: 1.5px solid #D5D3CE; background: #fff; color: var(--tx); }
button.on { border-color: var(--tx); background: var(--tx); color: #fff; }
button.primary { background: var(--tx); color: #fff; border-color: var(--tx); margin-left: auto; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--val); outline-offset: 2px; }
input, textarea { font: 15px/1.5 Inter, system-ui, sans-serif; color: var(--tx); border: 1px solid #D5D3CE; border-radius: 10px; padding: 11px 12px; width: 100%; background: #fff; }
label { display: grid; gap: 6px; font-size: 14px; color: var(--t2); margin-top: 16px; }
.err { color: #B3261E; font-size: 14px; min-height: 1.2em; margin-top: 10px; }
.done { text-align: center; padding: 40px 0; } .done .tick { font-size: 40px; color: var(--ok); }
.hidden { display: none !important; }
.q { font-weight: 600; font-size: 17px; color: var(--tx); }
.reply { background: var(--expw); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }

/* the family look (31 October 2026) */
html, body { font-family: 'DM Sans', system-ui, sans-serif; }
.sheet { border: 1px solid #141414; }
.over { font-family: 'DM Mono', monospace; font-weight: 500; letter-spacing: .08em; color: #e07030; }
h1 { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 38px; letter-spacing: -.02em; }
.sec h2, .q { font-family: 'Outfit', sans-serif; font-weight: 400; }
.words { font-family: 'Outfit', sans-serif; font-weight: 300; }
button, input, textarea { font-family: 'DM Sans', system-ui, sans-serif; border-color: #141414; background: #f4f3f0; }
button.primary { background: #e07030; border-color: #e07030; color: #f4f3f0; font-weight: 500; }
button.on { background: #141414; border-color: #141414; color: #f4f3f0; }
:focus-visible { outline-color: #e07030; }
.vt-hdr { display: flex; align-items: stretch; justify-content: space-between; height: 64px; border-bottom: 1px solid #c9c5bd; padding-left: max(16px, 2.6vw); } .vt-hdr a { display: flex; align-items: center; color: #141414; text-decoration: none; }
.vt-hdr .aboutlink { margin: 0; display: flex; align-items: center; padding: 0 22px; border-left: 1px solid #c9c5bd; }
.vt-foot .vt-family { color: #6b665f; } .vt-foot .vt-family b { color: #141414; }
</style>
</head>
<body>
<header class="vt-hdr"><a href="/hub" aria-label="Viability Thinking Lab: Home"><span class="vt-wordmark"><b>viabilitythinking</b><i>lab</i></span></a><span class="aboutlink"><a href="/about" target="_blank" rel="noopener">About Viability Thinking</a></span></header>
<main>

    <div class="err" id="signErr"></div>
    <div class="bar" style="border:0;margin-top:10px"><button class="primary" type="submit">Continue</button></div>
  </form>
  <div id="page"></div>
</main>
