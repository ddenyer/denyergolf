<title>Viability Thinking Lab: home</title>

<script>(function(){try{var t=localStorage.getItem('vt_theme');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<style>
:root { --hi: 255,255,255; --tx: 240,237,232; --sh: 0,0,0; --dk: 14,12,11; --bg: #000; --node: #0e0d0c; --nodeq: #1a110b; }

/* Two tabs. The hub: the overall model drawn with the four practices on its loops; light runs
   round the loops, along the feedback line and through the system. Built practices open straight away;
   the others explain themselves in a pop-up; the system, the service, the question, the gains, the
   outcome and feedback link to their place on the method tab. The method: each part explained.
   Reached with the session code and facilitator code (kept in this tab only), or from /admin. */
:root {
  --ink: #0d0c0b; --stage: var(--bg); --shade: #16130f; --box: #0b0a09;
  --paper: #f0ede8; --muted: #a09890; --dim: #5e5852; --line: #3a3530; --sheen: #ffffff;
  --accent: #e07030; --value: #fbf8f4; --pulse: #ffb27a; --signal: #c9bfb4; --hover: #24211e;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--paper); font-family: "DM Sans", system-ui, sans-serif; }
body { min-height: 100vh; background: radial-gradient(1100px 560px at 28% -8%, rgba(224,112,48,.12), transparent 60%), radial-gradient(900px 520px at 88% 6%, rgba(176,138,104,.09), transparent 60%), var(--bg); }
.wide { font-family: "Archivo", "DM Sans", sans-serif; font-weight: 700; font-stretch: 125%; font-variation-settings: "wdth" 125; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px max(16px, 3vw); border-bottom: 1px solid rgba(var(--hi),.12); flex-wrap: wrap; position: relative; z-index: 3; }
.brand { font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
.brand span { color: var(--accent); font-size: 11px; letter-spacing: .3em; margin-left: 6px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(var(--hi),.12); background: rgba(var(--hi),.03); }
.tabs button { font: 500 14px "DM Sans", system-ui, sans-serif; color: var(--muted); background: none; border: none; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--paper); background: rgba(var(--hi),.1); box-shadow: inset 0 1px 0 rgba(var(--hi),.12); }
.who { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.chip { font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--paper); border: 1px solid rgba(var(--hi),.14); border-radius: 999px; padding: 4px 12px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; background: rgba(var(--hi),.08); }
.pill.open { background: rgba(80,170,110,.18); color: #9fdcb3; } .pill.closed { background: rgba(224,170,60,.16); color: #f0cf8a; } .pill.expired { background: rgba(224,90,60,.18); color: #ffb4a0; }
.link { background: none; border: none; padding: 0; color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--paper); }
main { max-width: 1320px; margin: 0 auto; padding: 34px max(16px, 3vw) 60px; }
.title p { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.title h1 { margin: 0; font-size: clamp(26px, 3.8vw, 44px); line-height: 1.08; }
.center { max-width: 520px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
.center a { color: var(--paper); }
[hidden] { display: none !important; }

/* ---------- the hub: the overall model ---------- */
.flow { position: relative; margin: 30px 0 0; }
.mfig { position: relative; width: 100%; aspect-ratio: 1200 / 540; }
.hsvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; stroke: none; fill: none; }
.hsvg text { fill: var(--paper); font-family: "DM Sans", system-ui, sans-serif; }
.hlab { font-size: 11px; letter-spacing: .18em; fill: var(--muted) !important; }
.hsub { font-size: 12px; fill: var(--dim) !important; }
.hshade { fill: rgba(var(--hi),.045); }
.hsys { fill: none; stroke: rgba(var(--tx),.55); stroke-width: 1.6; stroke-dasharray: 7 6; }
.shit { position: absolute; cursor: pointer; z-index: 2; border-radius: 10px; } .shit:hover, .shit.sel { background: rgba(224,112,48,.08); box-shadow: 0 0 0 1px rgba(224,112,48,.35); }
.hdiv { stroke: rgba(var(--hi),.35); stroke-dasharray: 5 5; }
.harc { fill: none; stroke: rgba(var(--tx),.6); stroke-width: 2; }
.hfb { fill: none; stroke: rgba(var(--tx),.35); stroke-width: 1.4; stroke-dasharray: 5 5; }
.hlink { stroke: rgba(var(--tx),.5); stroke-width: 1.4; }
.hstep { fill: rgba(var(--hi),.07); stroke: rgba(var(--tx),.45); stroke-width: 1.4; transition: stroke .25s, fill .25s; }
.hstep.d { stroke-dasharray: 4 4; fill: rgba(var(--hi),.03); }
.hio { fill: var(--node); stroke: rgba(var(--tx),.55); stroke-width: 1.6; transition: stroke .25s, fill .25s; } .hiot { letter-spacing: .08em; }
.flow .mhit:hover, .flow .mhit.sel { border-radius: 9px; box-shadow: 0 0 0 2px rgba(224,112,48,.9); }
.hnode { fill: var(--node); stroke: rgba(var(--tx),.6); stroke-width: 2; transition: stroke .25s; }
.hnode.q { stroke: rgba(224,112,48,.9); fill: var(--nodeq); }
.hnt { font-weight: 700; letter-spacing: .1em; text-anchor: middle; pointer-events: none; }
.hrun { fill: none; stroke: rgba(255,170,110,.95); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 55 945; filter: url(#hglow); animation: hrun 9s linear infinite; }
.hrun.fbrun { stroke-width: 2.5; stroke-dasharray: 40 960; animation-duration: 11s; animation-delay: -3s; }
.hmglow { pointer-events: none; animation: hmglow 7s linear infinite; }
@keyframes hmglow { from { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } to { transform: translateX(880px); opacity: 0; } }
@keyframes hrun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
@media (prefers-reduced-motion: reduce) { .hrun, .hmglow { animation: none; opacity: 0; } }
.card { position: relative; border-radius: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; color: inherit; font: inherit;
  border: 1px solid rgba(var(--hi),.16); -webkit-backdrop-filter: blur(10px) saturate(140%); backdrop-filter: blur(10px) saturate(140%);
  box-shadow: 0 24px 60px rgba(var(--sh),.55), inset 0 1px 0 rgba(var(--hi),.22), inset 0 -1px 0 rgba(var(--sh),.4); transition: transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease, border-color .3s ease; overflow: hidden; }
.card:hover, .card.sel { border-color: rgba(224,112,48,.6); box-shadow: 0 30px 70px rgba(var(--sh),.6), 0 0 0 1px rgba(224,112,48,.25), 0 0 40px rgba(224,112,48,.2), inset 0 1px 0 rgba(var(--hi),.26); }
.card h2 { margin: 0; letter-spacing: .01em; }
.mfig .card { position: absolute; transform: translate(-50%, -50%); width: 19.2%; height: 10.4%; aspect-ratio: auto; padding: 0; border-radius: 999px; justify-content: center; z-index: 3;
  background: linear-gradient(160deg, rgba(var(--hi),.13), rgba(var(--hi),.04) 45%, rgba(var(--hi),.07)), rgba(var(--dk),.88); }
.mfig .card:hover, .mfig .card.sel { transform: translate(-50%, -58%); }
.mfig .card h2 { font-size: clamp(16px, 2.1vw, 28px); }
.hn { position: absolute; border-radius: 50%; cursor: pointer; z-index: 2; transition: box-shadow .25s ease; }
.hn:hover, .hn.sel { box-shadow: 0 0 0 6px rgba(224,112,48,.16), 0 0 30px rgba(224,112,48,.35); }
.mhit { position: absolute; cursor: pointer; z-index: 2; border-radius: 12px; }
.mhit:hover, .mhit.sel { background: rgba(224,112,48,.08); box-shadow: 0 0 0 1px rgba(224,112,48,.35); }
.fhit { position: absolute; cursor: pointer; z-index: 2; border-radius: 8px; }
.fhit:hover, .fhit.sel { background: rgba(224,112,48,.1); }
.hubnote { margin-top: 18px; display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; align-items: center; }
.hubnote b { color: var(--paper); font-weight: 500; }
.btn { font: 500 14px "DM Sans", system-ui, sans-serif; color: var(--paper); background: transparent; border: 1px solid rgba(var(--hi),.14); padding: 8px 16px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.btn:hover { background: rgba(var(--hi),.06); }
.btn[disabled] { opacity: .45; cursor: default; }
.msg { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 1.2em; }
@media (max-width: 760px) {
  .mfig { aspect-ratio: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hsvg, .hn, .mhit, .shit, .fhit { display: none; }
  .mfig .card { position: relative; left: auto !important; top: auto !important; transform: none; width: auto; height: 96px; border-radius: 22px; }
  .mfig .card:hover, .mfig .card.sel { transform: translateY(-4px); }
}

/* ---------- the method ---------- */
.mhead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mhead h2 { margin: 0; font-size: clamp(24px, 3vw, 34px); }
.mhead p { margin: 0; color: var(--muted); font-size: 15px; max-width: 70ch; line-height: 1.5; }
.mlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-top: 26px; }
.mpart { border-radius: 22px; padding: 24px 24px 20px; scroll-margin-top: 90px; transition: border-color .4s ease, box-shadow .4s ease;
  background: linear-gradient(160deg, rgba(var(--hi),.10), rgba(var(--hi),.03) 45%, rgba(var(--hi),.05)); border: 1px solid rgba(var(--hi),.14);
  box-shadow: 0 24px 60px rgba(var(--sh),.5), inset 0 1px 0 rgba(var(--hi),.18); }
.mpart.hl { border-color: rgba(224,112,48,.75); box-shadow: 0 0 0 1px rgba(224,112,48,.35), 0 0 46px rgba(224,112,48,.25), inset 0 1px 0 rgba(var(--hi),.2); }
.mpart .side { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.mpart h3 { margin: 8px 0 4px; font-size: 24px; }
.mpart .was { color: var(--accent); font-size: 13px; margin-bottom: 12px; }
.mpart p { color: rgba(var(--tx),.88); line-height: 1.6; font-size: 15px; margin: 0 0 12px; }
.mpart ul { margin: 0 0 14px; padding-left: 18px; color: var(--muted); line-height: 1.6; font-size: 14px; }
.mback { margin-top: 26px; }

/* ---------- the pop-up ---------- */
.veil { position: fixed; inset: 0; z-index: 10; background: rgba(var(--sh),.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.veil.on { opacity: 1; pointer-events: auto; }
.pop { position: relative; width: min(560px, 100%); max-height: 86vh; overflow: auto; border-radius: 22px; padding: 30px 30px 26px;
  background: linear-gradient(160deg, rgba(var(--dk),.92), rgba(var(--dk),.95)); border: 1px solid rgba(var(--hi),.16);
  box-shadow: 0 40px 100px rgba(var(--sh),.7), inset 0 1px 0 rgba(var(--hi),.18); transform: translateY(14px) scale(.98); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.veil.on .pop { transform: none; }
.pop .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; } .ptour { display: inline-flex; gap: 12px; align-items: center; font-size: 14px; } .ptour .pn { color: var(--muted); font-size: 13px; } .ptour button[disabled] { opacity: .35; cursor: default; }
.pop .x { position: absolute; top: 16px; right: 18px; font-size: 24px; line-height: 1; background: none; border: none; color: var(--muted); cursor: pointer; }
.pop .side { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pop h3 { margin: 8px 0 4px; font-size: 30px; }
.pop .was { color: var(--accent); font-size: 13px; margin-bottom: 16px; }
.pop p { color: rgba(var(--tx),.88); line-height: 1.6; font-size: 15.5px; margin: 0 0 16px; }
.pop ul { margin: 0 0 20px; padding-left: 18px; color: var(--muted); line-height: 1.65; font-size: 14.5px; }
.pop .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pop .state { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: rgba(var(--tx),.45); }
button:focus-visible, a:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
:root[data-theme="light"] {
  --hi: 30,30,32; --tx: 28,26,24; --sh: 60,60,70; --dk: 255,255,255; --bg: #fbfbfa; --node: #ffffff; --nodeq: #fff3ea;
  --paper: #1c1b1a; --muted: #6b6560; --dim: #8a847e; --line: rgba(0,0,0,.12); --accent: #c45a1c;
  --ok: #2e8a56; --part: #a8781c; --none: #c4502f; --skip: #8a837c; --reo: #6650c8; color-scheme: light;
}
:root[data-theme="light"] body { background: radial-gradient(1100px 560px at 28% -8%, rgba(224,112,48,.06), transparent 60%), #fbfbfa; }
:root[data-theme="light"] .top { background: rgba(251,251,250,.85); }
/* softer shadows on white */
:root[data-theme="light"] .col, :root[data-theme="light"] .card, :root[data-theme="light"] .panel, :root[data-theme="light"] .glass, :root[data-theme="light"] .prop, :root[data-theme="light"] .srcc, :root[data-theme="light"] .pop { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.07) !important; }
:root[data-theme="light"] .col, :root[data-theme="light"] .card, :root[data-theme="light"] .glass { background: linear-gradient(160deg, #ffffff, #f6f6f4) !important; border-color: rgba(0,0,0,.09) !important; }
:root[data-theme="light"] .pill.open { background: rgba(46,138,86,.12); color: #22704a; } :root[data-theme="light"] .pill.closed { background: rgba(168,120,28,.12); color: #7a5512; } :root[data-theme="light"] .pill.expired { background: rgba(196,80,47,.12); color: #9a3a20; }
:root[data-theme="light"] .mpart, :root[data-theme="light"] .mfig .card { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.07) !important; }
:root[data-theme="light"] .mpart { background: linear-gradient(160deg, #ffffff, #f6f6f4) !important; border-color: rgba(0,0,0,.09) !important; }
:root[data-theme="light"] .mfig .card { background: #ffffff !important; border-color: rgba(0,0,0,.12) !important; }
.themebtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.themebtn:hover { color: var(--paper); border-color: var(--accent); }
.themebtn svg { width: 16px; height: 16px; }

/* the shared header: Hub, the four practices, the model, and the depth; each page's own tabs sit below */
.tabs a { font: 500 14px "DM Sans", system-ui, sans-serif; color: var(--muted); background: none; border: none; padding: 7px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--paper); }
.tabs a[aria-current="page"] { color: var(--paper); background: rgba(var(--hi),.1); box-shadow: inset 0 1px 0 rgba(var(--hi),.12); }
.tabs a.soon { opacity: .6; }
.hdrmid { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.depth { flex: none; } .depth select { max-width: 200px; font: 500 14px "DM Sans", system-ui, sans-serif; color: var(--paper); background: rgba(var(--hi),.04); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; width: auto; }
.depth.saved select { border-color: var(--accent); }
.subtabs { max-width: 1320px; margin: 14px auto 0; padding: 0 max(16px, 3vw); display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs:empty { display: none; }
@media (max-width: 900px) { .hdrmid { flex: 1 1 100%; justify-content: flex-start; } .hdrmid .tabs { flex-wrap: wrap; } }
.subtabs button { font: 500 13px "DM Sans", system-ui, sans-serif; color: var(--muted); background: transparent; border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.subtabs button[aria-selected="true"] { color: var(--paper); border-color: var(--accent); background: rgba(224,112,48,.1); }
/* parts of the method switched off for this engagement (Project › What's included) */
.mfig .card.off, .mfig .mhit.off { opacity: .32; } .mfig .card.off h2::after { content: " (hidden)"; font-size: 11px; font-family: "DM Sans", sans-serif; font-stretch: 100%; letter-spacing: 0; font-weight: 500; }
/* ---------- the way in: welcome band, six steps, two doors (26 October 2026) ---------- */
.hubtitle { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.entry { display: flex; flex-direction: column; gap: 24px; margin: 26px 0 10px; }
.welcome { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: center; border: 1px solid rgba(var(--hi),.14); background: rgba(var(--hi),.04); border-radius: 22px; padding: 28px 32px; }
.welcome .wk { margin: 0 0 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.welcome h2 { margin: 0 0 12px; font-family: var(--display); font-weight: 500; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.15; }
.welcome p { margin: 0; line-height: 1.55; }
.wcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.wcols div { border-top: 1.5px solid var(--paper); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.wcols span { color: var(--muted); line-height: 1.45; }
.wlinks { margin-top: 16px !important; }
.wmodel { display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap; }
.wmodel i { font-style: normal; color: var(--muted); }
.wc { width: 74px; height: 74px; border-radius: 50%; border: 1.5px solid var(--paper); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; }
.wc.q { border-color: var(--accent); color: var(--accent); background: rgba(224,112,48,.1); }
.wb { padding: 8px 10px; border: 1.5px solid rgba(var(--hi),.3); border-radius: 8px; font-size: 11px; font-weight: 700; }
.ws { display: flex; gap: 3px; } .ws em { width: 15px; height: 42px; border-radius: 5px; background: var(--paper); }
.steps6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.s6 { border-top: 3px solid rgba(var(--hi),.2); padding-top: 8px; font-size: 13.5px; color: var(--paper); text-decoration: none; line-height: 1.35; }
.s6 span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.s6.done { border-top-color: var(--paper); } .s6.now { border-top-color: var(--accent); } .s6.now span { color: var(--accent); font-weight: 700; }
.doors { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
.door .dbtn { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: inherit; text-align: left; cursor: pointer; margin-top: auto; }
.door.main .dbtn { color: var(--bg); }
.dcur { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); margin-top: 4px; }
.dform { margin-top: 18px; border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
.dform h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 500; font-size: 24px; }
.dfl { font-size: 13px; color: var(--muted); margin-top: 6px; } .dform input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
.drow { display: flex; gap: 14px; align-items: center; margin-top: 10px; } .dsmall { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.dcodes { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 6px 0; } .dcodes dt { color: var(--muted); } .dcodes dd { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 17px; letter-spacing: .06em; }
.homeabout { margin-top: 28px; color: var(--muted); } .homeabout a { color: var(--paper); }
.doors.three { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); margin-top: 8px; }
.door.open .dgo { color: inherit; text-decoration: none; } .door.open .dalt { font-size: 14px; color: var(--muted); }
.door.open:hover { box-shadow: none; } .door .dlast { font-size: 13.5px; color: var(--muted); }
.vintro { margin-top: 44px; } .vintro .hubwhole { margin: 0 0 14px; }
.vdefs { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-bottom: 40px; }
.vdefs h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 500; font-size: clamp(22px, 2vw, 28px); }
.vdefs p, .vlede { margin: 0; font-size: 16px; line-height: 1.6; max-width: 70ch; }

/* ---------- The family look (31 October 2026, viability-family-kit/lab-brief.md) ----------
   Outfit for headings and the wordmark, DM Sans for text, DM Mono for labels; ink, ivory and the dark shell,
   orange as the only accent; square corners, 1px lines in place of shadows, square buttons. */
:root {
  --bg: #16130f; --ink: #16130f; --shade: #16130f; --box: #16130f; --node: #16130f; --nodeq: #221a12;
  --paper: #f4f3f0; --muted: #a09a90; --line: #3a3732; --accent: #e07030; --hover: #221e19;
  --display: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif; --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --h-ground: #16130f; --h-raised: #16130f; --h-tone: #221e19; --h-tone2: #2c2822; --h-ink: #f4f3f0; --h-ink2: #d8d4cc; --h-muted: #a09a90; --h-faint: #7d776e; --h-rule: #3a3732; --h-box: #f4f3f0; --h-accent: #e07030; --h-on-ink: #141414;
  --h-serif: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif; --h-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="light"] {
  --bg: #f4f3f0; --node: #f4f3f0; --nodeq: #fbe9dd; --paper: #141414; --muted: #6b665f; --line: rgba(20,20,20,.14); --accent: #e07030;
  --h-ground: #f4f3f0; --h-raised: #f4f3f0; --h-tone: #e8e5df; --h-tone2: #dcd8d0; --h-ink: #141414; --h-ink2: #3a3732; --h-muted: #6b665f; --h-faint: #8a857d; --h-rule: #d6d2ca; --h-box: #141414; --h-accent: #e07030; --h-on-ink: #f4f3f0;
}
:root[data-theme="light"] body, body { background: var(--bg); }
:root[data-theme="light"] .top { background: var(--bg); }
html, body { font-family: var(--body); }
*, *::before, *::after { border-radius: 0 !important; box-shadow: none !important; }
.hxname, .wide { font-family: var(--display) !important; font-stretch: 100% !important; font-variation-settings: normal !important; }
.abt .prose p.lead.drift { font-family: var(--display); font-weight: 300; }
.chip, .hm-code, .dcodes dd { font-family: "DM Mono", ui-monospace, Menlo, monospace; }
/* the header: the wordmark and the boxed bar */
.top.hm-hdr { height: 64px; padding: 0 0 0 40px; gap: 0; border-bottom: 1px solid var(--h-rule) !important; background: var(--h-ground) !important; align-items: stretch; }
body.home .top.hm-hdr { border-bottom: 1px solid var(--h-rule) !important; background: var(--h-ground) !important; }
.hm-logo { display: flex; align-items: center; padding-right: 28px; color: var(--h-ink); }
.hm-logo .vt-wordmark { font-size: 19px; letter-spacing: -.02em; margin: 0; color: var(--h-ink); font-weight: 600; } .hm-logo .vt-wordmark i { font-size: inherit; letter-spacing: inherit; margin: 0; }
.hsvg rect, .hxsvg rect { rx: 0; ry: 0; }
.vt-wordmark { font: 600 19px/1 var(--vt-head); letter-spacing: -.02em; white-space: nowrap; } .vt-wordmark b { font-weight: 600; color: var(--h-ink); } .vt-wordmark i { font-style: normal; font-weight: 400; color: var(--vt-orange); }
.hm-right { align-items: stretch; gap: 0; }
.hm-right > * { display: flex; align-items: center; padding: 0 22px; border-left: 1px solid var(--h-rule); }
.hm-about { font-size: 15px; }
.hm-menu { top: 100%; border: 1px solid var(--h-box); }
.hm-av { background: var(--h-tone); color: var(--h-ink); font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; }
/* headings */
.hm h1, .hm-method h2, .hm-door h2, .hm .dform h2 { font-family: var(--h-serif); font-weight: 300; letter-spacing: -.02em; }
.hm h1 { font-size: clamp(40px, 5.4vw, 64px); line-height: 1.04; }
.hm-door h2 { font-weight: 400; font-size: 26px; }
/* the doors: a boxed grid, 1px lines */
.hm-doors { gap: 0; border: 1px solid var(--h-box); }
.hm-doors > .hm-door + .hm-door { border-left: 1px solid var(--h-box); }
.hm-door { background: var(--h-raised); min-height: 300px; transition: background .15s ease; }
.hm-door:hover { transform: none; background: var(--h-tone); }
.hm-door.primary { background: var(--h-box); color: var(--h-on-ink); } .hm-door.primary:hover { background: var(--h-box); }
.hm-door.primary p, :root:not([data-theme="light"]) .hm-door.primary p { color: var(--h-on-ink); opacity: .78; }
.hm-door .icon, .hm-door.primary .icon, :root:not([data-theme="light"]) .hm-door.primary .icon { width: 132px; height: 90px; background: none; margin: -6px 0 6px -6px; display: block; }
.hm-door .icon img { width: 132px; height: 90px; display: block; }
.hm-door .go { font-weight: 500; color: var(--vt-orange); }
.hm-door.primary .go { color: var(--vt-orange); }
/* which plate shows: the light drawing on ivory, the dark drawing on the shell */
.pl-d { display: none !important; }
:root:not([data-theme="light"]) .pl-l { display: none !important; } :root:not([data-theme="light"]) .pl-d { display: block !important; }
:root[data-theme="light"] .hm-door.primary .pl-l { display: none !important; } :root[data-theme="light"] .hm-door.primary .pl-d { display: block !important; }
:root:not([data-theme="light"]) .hm-door.primary .pl-d { display: none !important; } :root:not([data-theme="light"]) .hm-door.primary .pl-l { display: block !important; }
@media (max-width: 860px) { .hm-doors > .hm-door + .hm-door { border-left: 0; border-top: 1px solid var(--h-box); } }
/* the four steps, each with its plate */
.vt-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--h-box); margin: 22px 0 26px; }
.vt-steps > div { padding: 18px 20px 20px; } .vt-steps > div + div { border-left: 1px solid var(--h-box); }
.vt-steps img { width: 132px; height: 90px; display: block; margin: 0 0 10px -6px; }
.vt-steps b { display: block; font: 400 22px/1.2 var(--vt-head); letter-spacing: -.01em; margin-top: 6px; }
.vt-steps span.q { display: block; color: var(--h-ink2); font-size: 15px; line-height: 1.5; margin-top: 4px; }
@media (max-width: 860px) { .vt-steps { grid-template-columns: 1fr 1fr; } .vt-steps > div:nth-child(3) { border-left: 0; } .vt-steps > div:nth-child(n+3) { border-top: 1px solid var(--h-box); } }
/* labels: orange capitals in DM Mono */
.hm-mine .k, .hm-li .pill, .pop .state { font-family: "DM Mono", ui-monospace, Menlo, monospace; font-weight: 500; color: var(--vt-orange); letter-spacing: .08em; }
/* buttons: square */
.hm .btn.solid, .hm .hm-solid { background: var(--vt-orange); color: #f4f3f0; font-weight: 500; padding: 12px 20px; }
.hm-ghost, .hm .btn, .hm-theme, .hm-mbtn { border: 1px solid var(--h-box); background: transparent; color: var(--h-ink); font-weight: 500; }
.hm .dform, .hm-list, .hm-mine, .hm-resume { border: 1px solid var(--h-box); background: var(--h-raised); }
.hm .dform input, .hm-menu .depth select { border: 1px solid var(--h-box); background: var(--h-ground); }
.hm-li .role { background: none; border: 1px solid var(--h-rule); }
body.home { min-height: 100vh; display: flex; flex-direction: column; } body.home > main { flex: 1 0 auto; width: 100%; box-sizing: border-box; }
/* the family line */
.vt-foot { border-top: 1px solid var(--h-rule); margin-top: 56px; padding: 22px 40px 28px; display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: baseline; justify-content: space-between; }
.vt-foot .vt-family a { color: inherit; text-decoration: none; } .vt-foot .vt-family a:hover b { color: var(--vt-orange); }
.vt-foot .vt-family { color: var(--h-muted); } .vt-foot .vt-family b { color: var(--h-ink); }
@media (max-width: 640px) { .top.hm-hdr { padding-left: 18px; } .hm-right > * { padding: 0 12px; } .vt-foot { padding: 20px 18px; } }
@media print { .vt-foot { display: none; } }
</style>
</head>

<script>
(function () {
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  // ---------- the method helix (29 October 2026): Frame, Diagnose, Model, Test ----------
  // Drawn from mocks/method-helix-mock.html in the Lab's look, light and dark. Every part opens a pop-up;
  // "Explore the method" walks through them in reading order. Wording from the mock and mocks/four-steps-table.md.
  var PARTS = {
    question: { side: 'Where it starts', name: 'The question', was: 'A working hypothesis, revised as we go', line: 'The problem, challenge or decision the organisation brings is turned into the question we work on. It is treated as a working hypothesis, not a fixed starting point: what we learn at every step can sharpen it, or show that the real problem is a different one.', list: ['the problem as the organisation brings it, in its own words', 'the question we turn it into, and who owns it', 'the decision it informs', 'revised whenever what we learn says so'] },
    frame: { side: 'Step 1 · How things are', name: 'Frame', was: 'What are we working on, and what is the question?', line: 'We hear why the organisation has come, define the service, turn the problem into the question, and agree what value must keep flowing and what harm would be intolerable. Frame starts from the problem, challenge or decision the organisation brings, and produces the system.', list: ['why they have come, and why now', 'the service: what it sits within, what people in it control, what is decided elsewhere', 'its inputs, work and outputs, and what it runs on', 'the question, and what value must keep flowing and what harm would be intolerable', 'testing the frame, and agreeing how we will work'] },
    system: { side: 'What Frame produces', name: 'The system', was: 'Its boundaries, its function and the six capitals it runs on', line: 'The service we are working on, inside a boundary agreed at the start: what it sits within, what the people in it control and what is decided elsewhere; its function (what comes in, the work, what goes out); and the six capitals it runs on, whether they are ours or someone else’s. This is what Frame hands on to Diagnose.', list: ['the boundaries', 'the function: inputs, work and outputs', 'the six capitals: financial, manufactured, human, social, natural and information'] },
    diagnose: { side: 'Step 2 · How things are', name: 'Diagnose', was: 'How does this system work and fail now, and why?', line: 'We gather the evidence (documents, interviews, data and outside reports) and map the system as it really runs. We always start with how it works: what goes right every day, and why, looking at work as it is really done. Then how it fails: what made it vulnerable, what triggers failure, and what keeps the problem going.', list: ['gathering the evidence, in four forms', 'maps of the system: processes, journeys, timelines', 'how it works: what goes right, and why', 'how it fails: predisposing, precipitating and perpetuating', 'the two balances, profiled'] },
    formulation: { side: 'What Diagnose produces', name: 'The formulation', was: 'How it works and how it fails, and why', line: 'A short account of the system with evidence for every claim, under two headings. How it works comes first, so it is not crowded out by the failure analysis. This is what Diagnose hands on to Model.', list: ['how it works. Protective: what goes right every day, and why', 'how it fails. Predisposing: what made it vulnerable', 'precipitating: what triggers failure', 'perpetuating: what keeps the problem going'] },
    model: { side: 'Step 3 · How things could be', name: 'Model', was: 'What changes would make it work better and fail better, and do they hold up under pressure?', line: 'We build a model of the flow and run it forward under severe but plausible scenarios, against the tolerances. The design team (the consultants and the organisation’s resilience team) designs the propositions and tests them offline, in the model, under pressure. This is testing the model (alpha).', list: ['the model of the flow, run forward', 'severe but plausible scenarios, against the tolerances', 'design propositions, some protecting what works, others fixing what fails', 'each tested in the model and compared with the other options'] },
    props: { side: 'What Model produces', name: 'Design propositions', was: 'Context, intervention, mechanisms, outcomes', line: 'Each proposition says that in this context, this intervention, working through these mechanisms, should produce these outcomes. Some protect and strengthen what works; others fix what fails. Each points back to the heading in the formulation it answers, and records how it held up when tested in the model.', list: ['the context it must work in', 'the intervention: what would be done', 'the mechanisms: why it would work', 'the intended outcomes', 'the conditions under which it holds'] },
    test: { side: 'Step 4 · How things could be', name: 'Test', was: 'Do the changes work in use, for the people who run the service?', line: 'The people who run the service try the propositions live, in this service. This is the trial in the organisation (beta). We record what happened and compare it with what the model predicted. Then we reflect: what worked, why, and what we now need to ask.', list: ['the propositions tried in use, by the people who run the service', 'what happened, against what the model predicted', 'reflect: what worked, why, and what we now need to ask'] },

  // ---------- the examples index (/examples): filter by sector, type and why they came; arrange by sector, date, type or closeness ----------
  var EXS = null, EXF = { sector: '', type: '', why: '', by: 'sector' }, MINE = '';
  var STOP = ['what', 'which', 'with', 'from', 'that', 'this', 'their', 'there', 'would', 'could', 'should', 'into', 'over', 'about', 'when', 'where', 'they', 'them', 'have', 'does', 'make', 'take', 'more', 'than', 'only', 'also', 'must', 'keep', 'stay', 'still', 'what', 'need', 'want', 'know', 'tell'];
  var words = function (t) { return String(t || '').toLowerCase().split(/[^a-z0-9]+/).filter(function (w) { return w.length > 3 && STOP.indexOf(w) < 0; }); };

  }

  function aboutFromHash() {
    var m2 = /^#about-([a-z]+)$/.exec(location.hash); if (!m2) return;

    var k = { problem: 'frame', analyse: 'diagnose', evaluate: 'model', inter: 'pace', feedback: 'reflect' }[m2[1]] || m2[1];

  }
  window.addEventListener('hashchange', aboutFromHash);
  load();
