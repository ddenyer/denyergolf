<script>/* The four steps (29 October 2026): Frame, Diagnose, Model, Test. The old addresses still work and move to the new ones. */(function(){try{var P=location.pathname,h=location.hash.replace(/^#/,''),q=location.search,to=null,k=h.split('=')[0];
if(k==='use'||k==='run')return;
var TEST={exlog:1,plans:1,selfassess:1,forcefield:1,pace:1,evidence:1,scentest:1,bia:1,risk:1,mvc:1,bcp:1,dr:1,steer:1},DIAG={nots:1,techmech:1};
if(P==='/problem')to='/frame'+q+location.hash;
else if(P==='/analyse')to='/diagnose'+q+location.hash;
else if(P==='/evaluate')to=(TEST[k]?'/test':DIAG[k]?'/diagnose':'/model')+q+location.hash;
else if(P==='/diagnose'&&(k==='model'||k==='medit'))to='/model'+q+(h==='model'?'#mworks':location.hash);
else if(P==='/model'&&(TEST[k]))to='/test'+q+location.hash;
else if(P==='/model'&&DIAG[k])to='/diagnose'+q+location.hash;
else if(P==='/test'&&h&&!TEST[k]&&k!=='tools'&&!/^(beta|reflect|thome|tmap|talpha|tplans|tbeta|tout|tcanvas|present|exp)$/.test(k))to=(DIAG[k]?'/diagnose':'/model')+q+location.hash;
if(to)location.replace(to);}catch(e){}})();</script>

<style>
/* while a new project opens on the guided framing, show its plain ground, not the canvas header (27 October 2026) */
html.gd-boot, html.gd-boot body { background: #FAF9F7 !important; }
html.gd-boot body:not(.gd-on) > * { visibility: hidden; }
:root { --hi: 255,255,255; --tx: 240,237,232; --sh: 0,0,0; --dk: 14,12,11; --bg: #000; --node: #0e0d0c; --nodeq: #1a110b; }

/* Problem: what is being looked at, for whom, and what would count as working or failing.
   Four views: the 19 tiles, the problem sheet, the frame page (sign and versions), and
   differing views (questions put to the room). Reached from the hub by a facilitator. */
:root {
  --paper: #f0ede8; --muted: #a09890; --dim: #6e6760; --line: rgba(var(--hi),.14); --accent: #e07030;
  --ok: #8fd3a8; --part: #e8c98a; --none: #ff9f8a; --skip: #8a837c; --reo: #c9b8ff;
  --glass: linear-gradient(160deg, rgba(var(--hi),.10), rgba(var(--hi),.03) 45%, rgba(var(--hi),.05));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--paper); font-family: "DM Sans", system-ui, sans-serif; }
body { min-height: 100vh; background: radial-gradient(1100px 560px at 28% -8%, rgba(224,112,48,.12), transparent 60%), radial-gradient(900px 520px at 88% 6%, rgba(176,138,104,.09), transparent 60%), var(--bg); }
.wide { font-family: "Archivo", "DM Sans", sans-serif; font-weight: 700; font-stretch: 125%; font-variation-settings: "wdth" 125; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px max(16px, 3vw); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; background: rgba(var(--sh),.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.brand { font-size: 18px; letter-spacing: .02em; white-space: nowrap; color: var(--paper); text-decoration: none; }
.brand span { color: var(--accent); font-size: 11px; letter-spacing: .3em; margin-left: 6px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: rgba(var(--hi),.03); flex-wrap: wrap; }
.tabs button, .tabs a { font: 500 14px "DM Sans", system-ui, sans-serif; color: var(--muted); background: none; border: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.tabs [aria-selected="true"] { color: var(--paper); background: rgba(var(--hi),.1); box-shadow: inset 0 1px 0 rgba(var(--hi),.12); }
.who { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.chip { font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.link { background: none; border: none; padding: 0; color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--paper); }
main { max-width: 1320px; margin: 0 auto; padding: 28px max(16px, 3vw) 120px; }
.kick { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.08; }
.evdrift { font-family: Newsreader, Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(22px, 2.2vw, 26px); line-height: 1.35; max-width: 34ch; margin: 12px 0 0; color: rgba(var(--tx),.95); }
.lead { color: rgba(var(--tx),.82); font-size: 16px; line-height: 1.55; max-width: 82ch; margin: 10px 0 0; }
.center { max-width: 520px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
.center a { color: var(--paper); }
.btn { font: 500 14px "DM Sans", system-ui, sans-serif; color: var(--paper); background: transparent; border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: rgba(var(--hi),.06); }
.btn.solid { background: var(--paper); color: var(--bg); border-color: var(--paper); font-weight: 700; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
[hidden] { display: none !important; }
textarea, input[type=text], select { width: 100%; font: 400 15px/1.45 "DM Sans", system-ui, sans-serif; color: var(--paper); background: rgba(var(--sh),.35); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; resize: vertical; }

/* state chips */

.st.done { color: var(--ok); } .st.partly { color: var(--part); border-style: dashed; } .st.none { color: var(--none); border-style: dashed; } .st.skip { color: var(--skip); border-style: dotted; } .st.reopened { color: var(--reo); }

.core { font-size: 11px; color: var(--muted); letter-spacing: .06em; }

/* the board */
.bar { margin: 22px 0 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { font: 500 13px "DM Sans", system-ui, sans-serif; color: var(--muted); background: none; border: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; }

.cols.halves::before { content: ""; position: absolute; top: -14px; bottom: -14px; left: calc(50% - 9px); right: -14px; border-radius: 0 26px 26px 0; background: linear-gradient(180deg, rgba(var(--dk),.5), rgba(var(--dk),.25)); z-index: 0; }

.col { position: relative; z-index: 1; border-radius: 22px; padding: 22px 14px 12px; overflow: hidden;
  background: linear-gradient(160deg, rgba(var(--hi),.12), rgba(var(--hi),.03) 45%, rgba(var(--hi),.06));
  border: 1px solid rgba(var(--hi),.16); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(8px) saturate(140%);
  box-shadow: 0 24px 60px rgba(var(--sh),.55), inset 0 1px 0 rgba(var(--hi),.22), inset 0 -1px 0 rgba(var(--sh),.4); }
.col::before { content: ""; position: absolute; inset: -30% -50% auto auto; width: 240px; height: 240px; background: radial-gradient(closest-side, rgba(var(--hi),.10), transparent); pointer-events: none; }
.col .chead { display: flex; justify-content: space-between; align-items: center; padding: 0 8px; }
.col .num { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
.col .ctitle { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 8px 0; }
.col .ctitle .plus { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(var(--hi),.16); background: transparent; color: var(--muted); font: 500 16px/1 "DM Sans", system-ui, sans-serif; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.col .ctitle .plus:hover, .col .ctitle .plus[aria-expanded="true"] { border-color: rgba(224,112,48,.7); color: var(--paper); }
.col .sumtab { display: inline-flex; align-items: center; margin: 12px 8px 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(224,112,48,.45); background: rgba(224,112,48,.08); color: var(--paper); font: 500 13px "DM Sans", system-ui, sans-serif; cursor: pointer; transition: background .2s, border-color .2s; }
.col .sumtab:hover { background: rgba(224,112,48,.18); border-color: rgba(224,112,48,.8); }
.col .sumtab::after { content: "\203A"; margin-left: 8px; color: var(--accent); }
.sumlist { margin-top: 22px; padding: 6px 22px; }
.sumlist.teamside { border-style: dashed; background: rgba(var(--hi),.02); } .sumlist.teamside > .label { display: block; padding: 14px 0 4px; }
.tile .team, .team { margin-left: 10px; font: 600 10px "DM Sans", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border: 1px dashed rgba(var(--hi),.25); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
.gplus { margin-top: 8px; background: none; border: 1px solid rgba(var(--hi),.16); border-radius: 999px; color: var(--muted); font: 500 12.5px "DM Sans", system-ui, sans-serif; padding: 4px 12px; cursor: pointer; }
.gplus:hover, .gplus[aria-expanded="true"] { color: var(--paper); border-color: rgba(224,112,48,.6); }
.gmore { margin-top: 8px !important; padding-left: 12px; border-left: 2px solid rgba(224,112,48,.5); color: rgba(var(--tx),.75) !important; }
.srow { padding: 16px 0; border-top: 1px solid rgba(var(--hi),.08); } .srow:first-child { border-top: none; }
.srow .sh { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.srow .sn { color: var(--paper); font-weight: 700; font-size: 16px; text-decoration: none; } .srow .sn:hover { color: var(--accent); }
.srow .sv { margin: 6px 0 0; color: rgba(var(--tx),.85); line-height: 1.55; max-width: 90ch; } .srow .sv.empty { color: var(--muted); }
.col h3 { margin: 0; text-align: left; font-size: clamp(17px, 1.6vw, 22px); line-height: 1.15; }
.col .d { color: var(--muted); font-size: 13px; margin: 8px 8px 0; line-height: 1.45; }
.tile { position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; border-radius: 14px; padding: 12px 12px 11px; margin: 0; background: transparent; border: none; border-top: 1px solid rgba(var(--hi),.08); transition: background .2s ease, transform .2s ease; }
.tile:hover, .tile:focus-visible { background: rgba(224,112,48,.09); transform: translateX(3px); outline: none; }
.tile.skip { opacity: .5; }
.tile .nm { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 15px; font-weight: 700; line-height: 1.25; }
.tile { padding: 11px 8px 11px 10px; }
.tile .tn { font-size: 15px; font-weight: 600; }
.tile .tr { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.tile .plus { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(var(--hi),.16); background: transparent; color: var(--muted); font: 500 16px/1 "DM Sans", system-ui, sans-serif; cursor: pointer; display: inline-grid; place-items: center; padding: 0; transition: border-color .2s, color .2s; }
.tile .plus:hover, .tile .plus[aria-expanded="true"] { border-color: rgba(224,112,48,.7); color: var(--paper); }
.tile .more { color: rgba(var(--tx),.72); font-size: 13px; line-height: 1.5; margin: 8px 36px 2px 0; cursor: default; }

.btop { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }

.btop .prog { font-size: 13px; color: var(--muted); }
.bfoot { display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(var(--hi),.07); font-size: 12.5px; color: var(--muted); }
.bfoot .quiet { background: none; border: none; padding: 0; font: 500 13px "DM Sans", system-ui, sans-serif; color: var(--muted); cursor: pointer; text-decoration: underline; text-decoration-color: rgba(var(--hi),.2); text-underline-offset: 4px; }
.bfoot .quiet:hover { color: var(--paper); }
.bfoot .kk { display: inline-flex; gap: 6px; align-items: center; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; }
.dot.done { color: var(--ok); background: var(--ok); box-shadow: 0 0 8px rgba(143,211,168,.6); } .dot.partly { color: var(--part); background: linear-gradient(90deg, var(--part) 50%, transparent 50%); } .dot.none { color: var(--none); } .dot.skip { color: var(--skip); border-style: dotted; } .dot.reopened { color: var(--reo); background: var(--reo); box-shadow: 0 0 8px rgba(201,184,255,.6); }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.start { margin: 22px 0 0; padding: 18px 20px; border-radius: 18px; border: 1px dashed rgba(224,112,48,.5); background: rgba(224,112,48,.06); display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.start p { margin: 0; color: rgba(var(--tx),.85); line-height: 1.5; max-width: 70ch; }
@media (max-width: 1000px) { .cols, .cols.six { grid-template-columns: 1fr 1fr; } .cols.halves::before, .cols.halves::after, .halflabs { display: none; } }
@media (max-width: 620px) { .cols, .cols.six { grid-template-columns: 1fr; } }

/* a tile page */
.tlay { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; margin-top: 6px; }
.tside { position: sticky; top: 84px; display: grid; gap: 0; max-height: calc(100vh - 170px); overflow: auto; padding-bottom: 8px; }
.tside .panel:first-child, .tside > div:first-child .room { margin-top: 18px; }
.tside .grid2 { grid-template-columns: 1fr; gap: 6px; }
.tmain > .blk:first-child .guide h3, .tmain .blk:first-child h3 { margin-top: 22px; }
@media (max-width: 1100px) { .tlay { grid-template-columns: 1fr; } .tside { position: static; max-height: none; order: -1; } }
.crumb { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tq { font-size: clamp(17px, 1.8vw, 21px); color: rgba(var(--tx),.86); margin: 12px 0 6px; line-height: 1.4; max-width: 80ch; }
.tname { margin: 10px 0 0; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.05; }
.meta { color: var(--muted); font-size: 14px; }
.panel { position: relative; margin-top: 18px; border-radius: 20px; padding: 18px 20px; background: linear-gradient(160deg, rgba(var(--hi),.08), rgba(var(--hi),.02) 50%, rgba(var(--hi),.04)); border: 1px solid rgba(var(--hi),.14); box-shadow: 0 18px 44px rgba(var(--sh),.45), inset 0 1px 0 rgba(var(--hi),.16); }
.panel.sent { border-color: rgba(232,201,138,.5); background: rgba(232,201,138,.06); }
.panel.seed { border-style: dashed; }
.panel h4 { margin: 0 0 8px; font-size: 14px; letter-spacing: .06em; }
.grid2 { display: grid; grid-template-columns: 220px 1fr; gap: 12px 16px; align-items: center; }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
.blk { margin-top: 22px; }
.blk.unknown .body { opacity: .38; pointer-events: none; }
.guide h3 { margin: 34px 0 6px; font-family: "Archivo", "DM Sans", sans-serif; font-weight: 700; font-stretch: 125%; font-variation-settings: "wdth" 125; font-size: 19px; letter-spacing: .01em; }
.guide p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 90ch; }
.quote textarea { font: 500 22px/1.35 "Cormorant Garamond", Georgia, serif; font-style: italic; min-height: 80px; }
.quote .locked { font: 500 23px/1.4 "Cormorant Garamond", Georgia, serif; font-style: italic; padding: 12px 16px; border-left: 3px solid var(--accent); background: rgba(var(--hi),.03); border-radius: 0 10px 10px 0; }
.cards { display: grid; gap: 12px; }
.card { border-radius: 18px; padding: 14px; background: linear-gradient(160deg, rgba(var(--hi),.09), rgba(var(--hi),.02) 50%, rgba(var(--hi),.04)); border: 1px solid rgba(var(--hi),.14); box-shadow: 0 14px 34px rgba(var(--sh),.4), inset 0 1px 0 rgba(var(--hi),.14); display: grid; gap: 8px; align-content: start; }
.card.on { border-color: rgba(224,112,48,.7); box-shadow: 0 0 0 1px rgba(224,112,48,.25) inset; }

.card .cf { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.card .cf input[type=text] { padding: 5px 8px; font-size: 13px; }
table.g { width: 100%; border-collapse: separate; border-spacing: 0; }

.xb { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; }

@media (max-width: 900px) { .quadw { grid-template-columns: 1fr; } }

.save { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px max(16px, 3vw); background: rgba(var(--dk),.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
.dirty { color: var(--part); }

/* the room */
.room { margin-top: 18px; border-radius: 16px; padding: 16px 18px; border: 1px solid rgba(224,112,48,.45); background: rgba(224,112,48,.05); }

/* sheet */

.sheet .full { grid-column: 1 / -1; }
.sheet .half { grid-column: span 1; }

.sbox .seeds { font-size: 11.5px; letter-spacing: .06em; color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1000px) { .sheet { grid-template-columns: 1fr; } .two { grid-template-columns: 1fr; } }
.force { display: grid; grid-template-columns: 1fr; gap: 12px; }
.frow { display: grid; grid-template-columns: 1fr 56px 26px; gap: 6px; align-items: center; margin-bottom: 6px; }
.fbar { height: 10px; border-radius: 5px; margin: 0 0 8px; }
.fbar.d { background: linear-gradient(90deg, rgba(143,211,168,.9), rgba(143,211,168,.3)); }
.fbar.h { background: linear-gradient(90deg, rgba(255,159,138,.9), rgba(255,159,138,.3)); margin-left: auto; }

/* frame page */

@media (max-width: 900px) { .fp { grid-template-columns: 1fr; } }
.fg h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.fl { display: grid; grid-template-columns: 170px 1fr auto; gap: 8px 12px; padding: 9px 0; border-bottom: 1px solid rgba(var(--hi),.07); font-size: 14px; align-items: start; }
.fl b { font-weight: 700; }
.fl span { color: rgba(var(--tx),.8); line-height: 1.4; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; line-height: 1.4; }
.vers { list-style: none; padding: 0; margin: 8px 0 0; }
.vers li { padding: 8px 0; border-bottom: 1px solid rgba(var(--hi),.07); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ok { color: var(--ok); } .no { color: var(--none); }
.veil { position: fixed; inset: 0; z-index: 10; background: rgba(var(--sh),.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
.pop { width: min(900px, 100%); max-height: 88vh; overflow: auto; border-radius: 20px; padding: 24px; background: #121110; border: 1px solid var(--line); }
@media print {
  .top, .save, .bar, .no-print { display: none !important; }
  body { background: #fff; color: var(--bg); } main { padding: 0; }
}

.invview { margin-top: 14px; }

.spofb { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 6px; background: rgba(217,71,43,.15); color: #e0664a; font-weight: 700; font-size: 12px; }
:root[data-theme="light"] .spofb { color: #a12f12; }
.itree, .itree ul { list-style: none; margin: 0; padding-left: 22px; } .itree { padding-left: 0; font-size: 14px; } .itree li { margin: 6px 0; } .itree ul { border-left: 1px dashed var(--line); }
.rtag { display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff; border-radius: 5px; padding: 1px 6px; margin-right: 7px; vertical-align: 1px; }
.iscroll { overflow: auto; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; }
.itab { border-collapse: collapse; width: 100%; font-size: 13px; } .itab th, .itab td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.itab th { position: sticky; top: 0; background: rgba(var(--dk),1); color: var(--muted); font-size: 12px; z-index: 1; }
.mx2 td, .mx2 th { text-align: center; } .mx2 td:first-child, .mx2 th:first-child { text-align: left; } .mx2 tr.sp td { background: rgba(217,71,43,.08); }

.ragd { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; } .ragd.r { background: #d9472b; } .ragd.a { background: #e2a52b; } .ragd.g { background: #3a9b63; }
.cbtab th.cbh { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; max-height: 170px; font-size: 12px; text-align: left; } .cbtab .cbn { white-space: nowrap; color: inherit; font-size: 13px; position: static; }
.cb { min-width: 44px; min-height: 36px; border-radius: 6px; font: 600 12px "DM Sans", system-ui, sans-serif; cursor: pointer; border: 1px dashed var(--line); background: none; color: var(--muted); }
.cb.v1 { background: var(--accent); border: 1px solid var(--accent); color: #140a04; } .cb.v0 { border: 1px solid currentColor; color: var(--paper); background: rgba(var(--hi),.06); } .cb.cbo.v1 { background: var(--paper); border-color: var(--paper); color: var(--bg); }
.cbans { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; } .cbans h4 { margin: 0 0 4px; } .cbpath { border-top: 1px solid var(--line); padding: 10px 0 4px; margin-top: 8px; display: grid; gap: 3px; }
.cbterms { font-size: 15px; } .cbt { font-weight: 600; } .cbt.abs { font-weight: 500; text-decoration: underline dotted; } .cband { font-weight: 400; color: var(--muted); }

.heat2 td.g, .heat2 td.a, .heat2 td.r { color: #fff; font-weight: 700; text-align: center; } .heat2 td.g { background: #3a9b63; } .heat2 td.a { background: #e2a52b; } .heat2 td.r { background: #d9472b; }

.irow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; } .irow input[type=text] { flex: 1; min-width: 140px; width: auto; } .irow select { min-width: 110px; }
